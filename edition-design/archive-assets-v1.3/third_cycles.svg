<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="32" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="start" fill="#25282c" font-weight="700">Chromatic third cycles: symmetry inside the 12-note system</text><text x="40" y="56" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#697078" font-weight="400">Major thirds (+4 semitones) close after 3 steps; minor thirds (+3) close after 4. These are not the same as the diatonic circle above.</text><line x1="260.0" y1="105.0" x2="363.92304845413264" y2="285.0" stroke="#c76535" stroke-width="2"/><line x1="363.92304845413264" y1="285.0" x2="156.07695154586736" y2="285.0" stroke="#c76535" stroke-width="2"/><line x1="156.07695154586736" y1="285.0" x2="260.0" y2="105.0" stroke="#c76535" stroke-width="2"/><circle cx="260.0" cy="105.0" r="28" fill="white" stroke="#c76535" stroke-width="2"/><text x="260.0" y="110.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#25282c" font-weight="700">C</text><circle cx="363.92304845413264" cy="285.0" r="28" fill="white" stroke="#c76535" stroke-width="2"/><text x="363.92304845413264" y="290.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#25282c" font-weight="700">E</text><circle cx="156.07695154586736" cy="285.0" r="28" fill="white" stroke="#c76535" stroke-width="2"/><text x="156.07695154586736" y="290.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#25282c" font-weight="700">Ab</text><text x="260" y="230" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#25282c" font-weight="700">major 3rds</text><line x1="650.0" y1="105.0" x2="770.0" y2="225.0" stroke="#2f7d74" stroke-width="2"/><line x1="770.0" y1="225.0" x2="650.0" y2="345.0" stroke="#2f7d74" stroke-width="2"/><line x1="650.0" y1="345.0" x2="530.0" y2="225.00000000000003" stroke="#2f7d74" stroke-width="2"/><line x1="530.0" y1="225.00000000000003" x2="650.0" y2="105.0" stroke="#2f7d74" stroke-width="2"/><circle cx="650.0" cy="105.0" r="28" fill="white" stroke="#2f7d74" stroke-width="2"/><text x="650.0" y="110.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#25282c" font-weight="700">C</text><circle cx="770.0" cy="225.0" r="28" fill="white" stroke="#2f7d74" stroke-width="2"/><text x="770.0" y="230.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#25282c" font-weight="700">Eb</text><circle cx="650.0" cy="345.0" r="28" fill="white" stroke="#2f7d74" stroke-width="2"/><text x="650.0" y="350.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#25282c" font-weight="700">Gb</text><circle cx="530.0" cy="225.00000000000003" r="28" fill="white" stroke="#2f7d74" stroke-width="2"/><text x="530.0" y="230.00000000000003" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#25282c" font-weight="700">A</text><text x="650" y="230" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#25282c" font-weight="700">minor 3rds</text><text x="260" y="365" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#697078" font-weight="400">C -&gt; E -&gt; Ab -&gt; C</text><text x="650" y="365" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#697078" font-weight="400">C -&gt; Eb -&gt; Gb -&gt; A -&gt; C</text>
</svg>