<text x="40" y="32" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="start" fill="#25282c" font-weight="700">Transposition pipeline</text><text x="40" y="56" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#697078" font-weight="400">Translate through function, not through a remembered keyboard shape.</text><rect x="45" y="68" width="200" height="86" fill="#f7f5ef" stroke="#b7b7b0" stroke-width="1.5" rx="10"/><text x="145" y="102" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#25282c" font-weight="700">Source notes</text><text x="145" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#697078" font-weight="400">Am - F - C - G</text><line x1="250" y1="110" x2="285" y2="110" stroke="#2f7d74" stroke-width="3"/><polygon points="285,110 272,103 272,117" fill="#2f7d74"/><rect x="290" y="68" width="200" height="86" fill="#eef4f2" stroke="#b7b7b0" stroke-width="1.5" rx="10"/><text x="390" y="102" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#25282c" font-weight="700">Function</text><text x="390" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#697078" font-weight="400">i - bVI - bIII - bVII</text><line x1="495" y1="110" x2="535" y2="110" stroke="#2f7d74" stroke-width="3"/><polygon points="535,110 522,103 522,117" fill="#2f7d74"/><rect x="540" y="68" width="200" height="86" fill="#f7f5ef" stroke="#b7b7b0" stroke-width="1.5" rx="10"/><text x="640" y="102" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#25282c" font-weight="700">Target spelling</text><text x="640" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#697078" font-weight="400">Bbm - Gb - Db - Ab</text><line x1="745" y1="110" x2="765" y2="110" stroke="#2f7d74" stroke-width="3"/><polygon points="765,110 752,103 752,117" fill="#2f7d74"/><rect x="770" y="68" width="200" height="86" fill="#eef4f2" stroke="#b7b7b0" stroke-width="1.5" rx="10"/><text x="870" y="102" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#25282c" font-weight="700">Hand geometry</text><text x="870" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#697078" font-weight="400">voice-led piano voicing</text>
